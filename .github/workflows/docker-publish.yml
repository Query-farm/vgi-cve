# Copyright 2026 Query Farm LLC - https://query.farm
#
# Build and publish the multi-arch vgi-cve image to ghcr.io. The heavy lifting
# (multi-arch build -> per-arch /health boot smoke -> image test -> push ->
# manifest -> cosign-sign) lives in the shared reusable workflow
# Query-farm/vgi-actions; this file gates on the repo's own CI and supplies the
# worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z/:X.Y/:latest, push to main -> :edge. Publishing a
# GitHub Release creates the tag, which fires this too.
name: Publish image to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite (three
  # transports) + metadata-quality lint, so a broken worker is never imaged.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-cve
      # Go binary — nothing to `import`, so the language-import smoke is skipped.
      # The reusable workflow still runs its dual-arch HTTP /health boot smoke.
      smoke_import: ""
      health_port: "8000"
      # No ci/check-version.sh in this repo, so no tag<->version gate is wired.
      # Validate the built IMAGE's entrypoints against the signed vgi extension.
      # The worker *logic* is already exercised every run by the gating `ci` job
      # (all test/sql/*, three transports, two OSes, against the mock NVD), so
      # here we only prove the IMAGE's entrypoints speak the protocol end to end.
      # We run the OFFLINE CVSS suite (test/sql/cvss_offline.test) — it makes no
      # NVD call, so it needs no mock (a host-side mock at 127.0.0.1 is
      # unreachable from inside the container anyway) — over each entrypoint:
      #   - stdio: `docker run … stdio` as the ATTACH LOCATION (on-host mode);
      #   - HTTP : the same suite against a SINGLE warm container via the default
      #            `http` entrypoint + /health.
      # SKIP_MOCK=1 skips the mock/go-build; TEST_PATTERN narrows to the offline
      # file. run-integration.sh's silent-skip guard still catches a broken HTTP
      # transport. $CITEST_IMAGE is the loaded <image>:citest-amd64 ref; GH_TOKEN
      # is provided for the haybarn download.
      image_test: |
        echo "::group::download haybarn-unittest"
        REL=$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)
        gh release download "$REL" --repo Query-farm-haybarn/haybarn \
          --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
        mkdir -p hb && unzip -o -q hb.zip -d hb
        export HAYBARN_UNITTEST="$PWD/$(find hb -name 'haybarn-unittest' -type f | head -1)"
        chmod +x "$HAYBARN_UNITTEST"
        echo "::endgroup::"

        echo "::group::stdio entrypoint smoke (offline CVSS suite, cold container per ATTACH)"
        SKIP_MOCK=1 \
          TRANSPORT=subprocess \
          TEST_PATTERN="test/sql/cvss_offline.test" \
          VGI_CVE_WORKER="docker run -i --rm $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"

        echo "::group::http entrypoint smoke (offline CVSS suite, one warm container)"
        CID=$(docker run -d -p 18000:8000 "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        SKIP_MOCK=1 \
          TRANSPORT=http \
          TEST_PATTERN="test/sql/cvss_offline.test" \
          VGI_CVE_WORKER="http://localhost:18000" \
          ci/run-integration.sh
        echo "::endgroup::"
