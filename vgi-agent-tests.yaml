# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (cmd/vgi-cve-worker/main.go).
# The answers live here, keyed by task name, so the agent being graded never
# sees them (VGI416). vgi-lint discovers this file in the directory it runs
# from (the repo root in CI). Keep it in sync when a task is added, renamed
# or changed.
tasks:
  - name: "score_log4shell_vector"
    reference_sql: "SELECT cve.main.cvss_base_score('CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H') AS base_score;"
    ignore_column_names: true
  - name: "severity_band_for_critical_score"
    reference_sql: "SELECT cve.main.cvss_severity(9.8) AS severity;"
    ignore_column_names: true
  - name: "severity_band_for_medium_score"
    reference_sql: "SELECT cve.main.cvss_severity(5.0) AS severity;"
    ignore_column_names: true
  - name: "score_then_band"
    reference_sql: "SELECT cve.main.cvss_base_score('CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H') AS base_score, cve.main.cvss_severity(cve.main.cvss_base_score('CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H')) AS severity;"
  - name: "band_for_score_7_5"
    reference_sql: "SELECT severity FROM cve.main.cvss_severity_bands WHERE 7.5 BETWEEN min_score AND max_score;"
    ignore_column_names: true
  - name: "high_band_vectors"
    reference_sql: "SELECT v.vector, cve.main.cvss_base_score(v.vector) AS base_score FROM (VALUES ('CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N'), ('CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H'), ('CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N'), ('CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H'), ('CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:L/I:N/A:N')) v(vector) WHERE cve.main.cvss_severity(cve.main.cvss_base_score(v.vector)) = 'HIGH' ORDER BY base_score;"
    unordered: true
  # Live NVD lookups: the data drifts, so these assert with check_sql against
  # the canonical Log4Shell record instead of exact-comparing a result.
  - name: "lookup_log4shell_cve"
    check_sql: "SELECT count(*) = 1 FROM cve.main.cve('CVE-2021-44228') WHERE cvss_severity = 'CRITICAL' AND cvss_score >= 9.0;"
  - name: "search_log4j_finds_log4shell"
    check_sql: "SELECT bool_or(id = 'CVE-2021-44228') FROM cve.main.cve_search('log4j');"
  - name: "cpe_lists_log4shell"
    check_sql: "SELECT bool_or(cve_id = 'CVE-2021-44228') FROM cve.main.cpe_cves('cpe:2.3:a:apache:log4j:2.14.1:*:*:*:*:*:*:*');"
